# Fleet bundle config for the capdo/ directory
# Keep the bundle scoped and prevent drift fights with the CAPI Operator.

# Namespace where the provider and its secret live (created by Fleet if missing)
defaultNamespace: capdo-system

# The operator owns provider status fields — don't let drift remediation revert them
diff:
  comparePatches:
    - apiVersion: operator.cluster.x-k8s.io/v1alpha2
      kind: InfrastructureProvider
      name: digitalocean
      jsonPointers:
        - /status

