---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    cluster.x-k8s.io/provider: infrastructure-digitalocean
    clusterctl.cluster.x-k8s.io: ""
    control-plane: capdo-controller-manager
  name: capdo-controller-manager
  namespace: capdo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: infrastructure-digitalocean
      control-plane: capdo-controller-manager
  strategy: {}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        cluster.x-k8s.io/provider: infrastructure-digitalocean
        control-plane: capdo-controller-manager
    spec:
      containers:
      - args:
        - --leader-elect
        - --diagnostics-address=:8444
        - --insecure-diagnostics=false
        env:
        - name: DIGITALOCEAN_API_URL
          value: "https://api.devcloud.amd.com"
        - name: HTTPS_PROXY
          value: "https://api.devcloud.amd.com"
        - name: DIGITALOCEAN_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              key: credentials
              name: capdo-manager-bootstrap-credentials
        image: registry.k8s.io/cluster-api-do/cluster-api-do-controller:v1.6.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        name: manager
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256M
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 9440
          name: healthz
          protocol: TCP
        - containerPort: 8444
          name: metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      - args:
        - --secure-listen-address=0.0.0.0:8443
        - --upstream=http://127.0.0.1:8080/
        - --logtostderr=true
        - --v=10
        image: ghcr.io/kube-rbac-proxy/kube-rbac-proxy:v0.23.1
        name: kube-rbac-proxy
        ports:
        - containerPort: 8443
          name: https
        resources: {}
      serviceAccountName: capdo-manager
      terminationGracePeriodSeconds: 10
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      volumes:
      - name: cert
        secret:
          defaultMode: 420
