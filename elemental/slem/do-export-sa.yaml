apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: do-seedimage-reader
  namespace: fleet-default          # must be here, not do-image-publisher
rules:
  - apiGroups: ["elemental.cattle.io"]
    resources: ["seedimages"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["do-seedimage-publisher-state"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: do-seedimage-reader
  namespace: fleet-default
subjects:
  - kind: ServiceAccount
    name: do-seedimage-publisher
    namespace: do-image-publisher
roleRef:
  kind: Role
  name: do-seedimage-reader
  apiGroup: rbac.authorization.k8s.io